services:
    app:
        build:
            context: .
            target: app
        restart: unless-stopped
        environment:
            APP_NAME: ${APP_NAME:-日報アプリ}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY:-}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:?Set APP_URL in .env.production}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            LOG_LEVEL: ${LOG_LEVEL:-warning}
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
            DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
            CACHE_DRIVER: ${CACHE_DRIVER:-file}
            SESSION_DRIVER: ${SESSION_DRIVER:-file}
            SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
            SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
            MAIL_MAILER: ${MAIL_MAILER:-smtp}
            MAIL_HOST: ${MAIL_HOST:-}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME:-}
            MAIL_PASSWORD: ${MAIL_PASSWORD:-}
            MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-日報アプリ}
        volumes:
            - app-storage:/var/www/html/storage
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php artisan migrate:status --no-interaction >/dev/null"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        networks:
            - backend

    next:
        build:
            context: .
            target: frontend
        restart: unless-stopped
        environment:
            HOSTNAME: 0.0.0.0
        expose:
            - "3000"
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        networks:
            - backend

    web:
        build:
            context: .
            target: web
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:8080"
        depends_on:
            app:
                condition: service_healthy
            next:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - frontend
            - backend

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
            MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\"",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - backend

volumes:
    app-storage:
    mysql-data:

networks:
    frontend:
    backend:
        internal: true
